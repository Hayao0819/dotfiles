name: Update Flake Inputs

on:
  schedule:
    # 毎週月曜日の午前9時(JST) = UTC 0:00
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      inputs:
        description: "Space-separated list of inputs to update (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@main
        with:
          inputs: ${{ github.event.inputs.inputs }}
          pr-title: "chore: update flake inputs"
          pr-labels: |
            dependencies
            automated
          commit-msg: "chore: update flake.lock"
