name: Test Flake

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators

      - name: Check flake
        run: nix flake check --show-trace

  build:
    strategy:
      fail-fast: false
      matrix:
        pattern:
          - system: ubuntu-latest
            target: XPS9350
          - system: ubuntu-latest
            target: WSL
          - system: ubuntu-latest
            target: Installer
          - system: macos-latest
            target: MacBook
          # Nix On Droid doesn't provide activation on derivation
          # - system: ubuntu-24.04-arm
          #   target: termux

    runs-on: ${{ matrix.pattern.system }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators

      - name: Build NixOS configuration
        if: ${{ matrix.pattern.system == 'ubuntu-latest' }}
        run: nix build .#nixosConfigurations.${{ matrix.pattern.target
          }}.config.system.build.toplevel --show-trace --accept-flake-config --fallback

      - name: Build MacOS configuration
        if: ${{ matrix.pattern.system == 'macos-latest' }}
        run: nix build .#darwinConfigurations.${{ matrix.pattern.target
          }}.config.system.build.toplevel --show-trace --accept-flake-config --fallback

      - name: Build Nix-On-Droid configuration
        if: ${{ matrix.pattern.system == 'ubuntu-24.04-arm' }}
        run: nix build .#nixOnDroidConfigurations.${{ matrix.pattern.target
          }}.config.build.activationPackage --show-trace --accept-flake-config --fallback

  update-merge:
    name: "Merge Update PRs"
    needs: [test, build]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.user.login
      == 'Hayao0819' || contains(github.event.pull_request.labels.*.name, 'automated'))
      }}

    steps:
      - name: Enable auto-merge for Update PRs
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
